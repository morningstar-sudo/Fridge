name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres: # the metadata database the tests create their own databases in (scripts/test-db.sh locally)
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test -race -count=1 ./...

  # The real thing: two docker:dind containers form a swarm; the installer, the Go integration tests, the shell
  # scenarios and the browser smoke run against locally built images.
  swarm:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - name: Build the images
        run: |
          docker build -f deploy/Dockerfile -t fridge:dev .
          docker build -f deploy/Dockerfile --target job -t fridge-job:dev .
      - name: Pull what the swarm needs
        run: |
          for i in postgres:17 postgres:18 traefik:v3.5 cgr.dev/chainguard/minio:latest cgr.dev/chainguard/minio-client:latest; do docker pull -q "$i"; done
      - name: Integration tests in the swarm
        run: |
          bash scripts/swarm-test/up.sh fridge:dev fridge-job:dev postgres:17 postgres:18 traefik:v3.5 cgr.dev/chainguard/minio:latest cgr.dev/chainguard/minio-client:latest
          bash scripts/swarm-test/gotest.sh
      - name: Installer and end-to-end scenarios
        run: |
          bash scripts/swarm-test/down.sh
          bash scripts/swarm-test/up.sh fridge:dev fridge-job:dev postgres:17 postgres:18 traefik:v3.5 cgr.dev/chainguard/minio:latest cgr.dev/chainguard/minio-client:latest
          bash scripts/swarm-test/e2e.sh
      - name: Browser smoke
        run: |
          bash scripts/swarm-test/down.sh
          bash scripts/swarm-test/up.sh fridge:dev fridge-job:dev postgres:17 postgres:18 traefik:v3.5 cgr.dev/chainguard/minio:latest cgr.dev/chainguard/minio-client:latest
          bash scripts/ui-smoke/run.sh
      - if: always()
        run: bash scripts/swarm-test/down.sh

  images:
    runs-on: ubuntu-latest
    needs: [test, swarm]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/morningstar-sudo/fridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.server.outputs.tags }}
          labels: ${{ steps.server.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - id: job
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/morningstar-sudo/fridge-job
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: job
          platforms: linux/amd64 # x86_64 only: the MySQL apt repo has no arm64 for bookworm, MongoDB 8.0 no arm64 database tools
          push: true
          tags: ${{ steps.job.outputs.tags }}
          labels: ${{ steps.job.outputs.labels }}
          cache-from: type=gha,scope=job
          cache-to: type=gha,mode=max,scope=job
