# Overlay for a throwaway stack next to a real one: other project name, container names, network and host ports.
# Used by run.sh together with deploy/docker-compose.yml.
name: fridge-ui

services:
  traefik:
    container_name: fridge-ui-traefik
    ports: !override
      - "127.0.0.1:15432:5432"
      - "127.0.0.1:18443:8443"
      - "127.0.0.1:18080:8080"
  fridge:
    environment:
      FRIDGE_NETWORK: fridge-ui-net
      FRIDGE_TRAEFIK_CONTAINER: fridge-ui-traefik
  minio:
    ports: !override
      - "127.0.0.1:19000:9000"

networks:
  fridge-net:
    name: fridge-ui-net
