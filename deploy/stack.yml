# Fridge on Docker Swarm. Deploy (or upgrade) with install.sh, or by hand from the directory holding .env:
#   set -a; . ./.env; set +a; docker stack deploy --with-registry-auth -c stack.yml fridge
#
# Everything is a swarm service; adding a server is `docker swarm join` (plus, for a server that may hold databases,
# `docker node update --label-add fridge.db=true <node>`). Nothing runs on the other servers but Docker itself.

services:
  # One Traefik per server: the database port goes through the routing mesh (any server answers on 5432), the web
  # UI/API port is published on the server itself so the real client address reaches the allowlist.
  # Routes, certificates and the allowlist come from Fridge (http provider), not from files.
  traefik:
    image: traefik:v3.5
    command:
      - --log.level=INFO
      - --entrypoints.web.address=:8080
      - --entrypoints.websecure.address=:8443
      - --entrypoints.pg.address=:5432
      - --entrypoints.ping.address=:8082
      - --ping.entrypoint=ping
      - --providers.http.endpoint=http://fridge:8081/traefik
      - --providers.http.pollInterval=5s
      - --providers.http.headers.Authorization=Bearer ${FRIDGE_PROVIDER_TOKEN:?run install.sh, or set FRIDGE_PROVIDER_TOKEN in .env}
    ports:
      - { target: 5432, published: 5432, protocol: tcp, mode: ingress }
      - { target: 8443, published: 8443, protocol: tcp, mode: host }
      - { target: 8080, published: 8080, protocol: tcp, mode: host }
    networks: [fridge_edge]
    deploy:
      mode: global
      restart_policy: { condition: any }
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=ping", "--entrypoints.ping.address=:8082"]
      interval: 10s
      timeout: 5s
      retries: 3

  fridge-meta:
    image: postgres:18
    environment:
      POSTGRES_DB: fridge
      POSTGRES_USER: fridge
      POSTGRES_PASSWORD: ${FRIDGE_META_PASSWORD:?run install.sh, or set FRIDGE_META_PASSWORD in .env}
    volumes:
      - fridge-meta:/var/lib/postgresql # image 18 keeps PGDATA below this (…/18/docker); a volume made by 17 does not open
    networks: [fridge_meta]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.fridge.control == true]
      restart_policy: { condition: any }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fridge", "-d", "fridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  fridge:
    image: ${FRIDGE_IMAGE:-ghcr.io/morningstar-sudo/fridge:latest}
    environment:
      FRIDGE_DATABASE_URL: postgres://fridge:${FRIDGE_META_PASSWORD}@fridge-meta:5432/fridge?sslmode=disable
      FRIDGE_SECRET_KEY: ${FRIDGE_SECRET_KEY:?run install.sh, or set FRIDGE_SECRET_KEY in .env}
      FRIDGE_PROVIDER_TOKEN: ${FRIDGE_PROVIDER_TOKEN}
      FRIDGE_SETUP_TOKEN: ${FRIDGE_SETUP_TOKEN:-} # creates the first admin; unused afterwards
      FRIDGE_PUBLIC_HOSTS: ${FRIDGE_PUBLIC_HOSTS:-}
      FRIDGE_TRUSTED_PROXY: ${FRIDGE_TRUSTED_PROXY:-} # empty = the fridge_edge subnet
      FRIDGE_ALERT_WEBHOOK: ${FRIDGE_ALERT_WEBHOOK:-}
      FRIDGE_SERVER_IMAGE: ${FRIDGE_IMAGE:-ghcr.io/morningstar-sudo/fridge:latest} # edge sidecars, volume jobs
      FRIDGE_JOB_IMAGE: ${FRIDGE_JOB_IMAGE:-ghcr.io/morningstar-sudo/fridge-job:latest} # dump, restore, check
      FRIDGE_EDGE_NETWORK: fridge_edge
      FRIDGE_EGRESS_NETWORK: fridge_egress
      FRIDGE_LISTEN: ":8080"
      FRIDGE_PROVIDER_LISTEN: ":8081"
      FRIDGE_DATA: /data
      FRIDGE_API_BACKEND: http://fridge:8080
      TZ: ${TZ:-UTC} # time zone of backup schedules
    volumes:
      - fridge-data:/data
      - /var/run/docker.sock:/var/run/docker.sock # the swarm API: only a manager has it, so Fridge runs on one
    networks: [fridge_edge, fridge_meta]
    stop_grace_period: 40s # the server waits up to 30s for running jobs
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.fridge.control == true]
      restart_policy: { condition: any }
    healthcheck:
      test: ["CMD", "/fridge", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  fridge-meta:
  fridge-data:

networks:
  # Traefik, Fridge and every database's edge sidecar. Databases themselves are never on it.
  fridge_edge:
    name: fridge_edge
    driver: overlay
    attachable: true
    driver_opts: { encrypted: "" }
  # Empty and open to the internet: the only network a dump/restore/check job shares with S3.
  fridge_egress:
    name: fridge_egress
    driver: overlay
    attachable: true
    driver_opts: { encrypted: "" }
  fridge_meta:
    driver: overlay
    internal: true
    driver_opts: { encrypted: "" }
